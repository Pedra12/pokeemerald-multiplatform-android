name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and SDL2 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ARM binutils and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev zlib1g-dev pkg-config
          command -v arm-none-eabi-gcc
          command -v arm-none-eabi-cpp
          command -v arm-none-eabi-as
          arm-none-eabi-gcc --version
          make tools
          make generated

      - name: Generate all game assets required by native sources
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess

          roots = ["src", "gflib", "data", "asm", "include", "sound"]
          incbin_pattern = re.compile(r'INCBIN_[A-Za-z0-9_]+\s*\((.*?)\)', re.DOTALL)
          asm_pattern = re.compile(r'\.incbin\s+"([^"]+)"')
          string_pattern = re.compile(r'"([^"]+)"')
          assets = set()
          for root in roots:
              base = pathlib.Path(root)
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if path.is_file() and path.suffix in {".c", ".h", ".inc", ".s"}:
                      try:
                          source = path.read_text(encoding="utf-8")
                      except UnicodeDecodeError:
                          continue
                      for match in incbin_pattern.finditer(source):
                          for asset in string_pattern.findall(match.group(1)):
                              if asset and not asset.startswith("/"):
                                  assets.add(asset)
                      for match in asm_pattern.finditer(source):
                          asset = match.group(1)
                          if asset and not asset.startswith("/"):
                              assets.add(asset)

          if not assets:
              raise SystemExit("Nenhuma referência INCBIN foi encontrada; interrompendo para evitar APK incompleto.")

          targets = sorted(assets)
          print(f"Gerando/verificando {len(targets)} arquivos de recursos do jogo.")
          subprocess.run(["make", "-j2", "NODEP=1", "SETUP_PREREQS=0", *targets], check=True)

          missing = [asset for asset in targets if not pathlib.Path(asset).is_file()]
          if missing:
              print("Recursos ainda ausentes:")
              print("\n".join(missing[:100]))
              raise SystemExit(f"{len(missing)} recursos continuam ausentes.")
          print("Todos os recursos referenciados foram encontrados ou gerados.")
          PY

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android /opt/android-sdk -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Falha ao aceitar as licenças do Android SDK (status $LICENSE_STATUS)"
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Apply SDL2 Android lifecycle patch
        run: |
          git -C android/SDL2 apply --check --unidiff-zero ../patches/sdl2-android-lifecycle.patch
          git -C android/SDL2 apply --unidiff-zero ../patches/sdl2-android-lifecycle.patch

      - name: Build debug APK
        env:
          ARM_NONE_EABI_TOOLCHAIN: /usr
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
