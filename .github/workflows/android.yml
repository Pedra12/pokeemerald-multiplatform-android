name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and SDL2 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ARM binutils and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi
          make -C tools/preproc

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android /opt/android-sdk -type f -path '*/cmdline-tools/*/bin/sdkmanager' -print 2>/dev/null || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Falha ao aceitar as licenças do Android SDK (status $LICENSE_STATUS)"
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Apply SDL2 Android lifecycle patch
        run: |
          git -C android/SDL2 apply --check --unidiff-zero ../patches/sdl2-android-lifecycle.patch
          git -C android/SDL2 apply --unidiff-zero ../patches/sdl2-android-lifecycle.patch

      - name: Build debug APK
        env:
          ARM_NONE_EABI_TOOLCHAIN: /usr
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
