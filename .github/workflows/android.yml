name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and SDL2 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install ARM binutils and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi
          make -C tools/preproc

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Apply SDL2 Android lifecycle patch
        run: |
          git -C android/SDL2 apply --check ../patches/sdl2-android-lifecycle.patch
          git -C android/SDL2 apply ../patches/sdl2-android-lifecycle.patch

      - name: Build debug APK
        env:
          ARM_NONE_EABI_TOOLCHAIN: /usr
        run: |
          chmod +x android/SDL2/android-project/gradlew
          android/SDL2/android-project/gradlew -p android :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
